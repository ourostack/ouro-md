name: Window chrome

# Captures real scrolling content plus quiet native chrome, with flat-layout and reflected-edge controls. Interactive tests run only on the hosted Mac.

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'make-app.sh'
      - 'Package.swift'
      - 'scripts/capture-window-chrome.sh'
      - 'scripts/run-hosted-native-proof.sh'
      - 'scripts/lib/window-id.swift'
      - '.github/workflows/window-chrome.yml'
      - 'Tests/OuroMDTests/NativeHeaderRenderingTests.swift'
      - 'Tests/OuroMDTests/FullscreenBackdropTests.swift'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-window-chrome-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture native header (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [xcode-27, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select native rendering toolchain
        run: |
          if [[ '${{ matrix.runner }}' == 'xcode-27' ]]; then
            sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          fi
          xcodebuild -version
          sw_vers
      - name: Verify quiet native header while real document content scrolls
        env:
          OURO_HEADER_RENDERING: '1'
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_HEADER_EXPECT_GLASS: '1'
          OURO_HEADER_REQUIRE_LIVE_PAINT: ${{ matrix.runner == 'macos-26-intel' && '1' || '0' }}
          OURO_HEADER_REQUIRE_FULLSCREEN: ${{ matrix.runner == 'xcode-27' && '1' || '0' }}
          OURO_HEADER_ONSCREEN_DIAGNOSTIC: ${{ matrix.runner == 'xcode-27' && '1' || '0' }}
          OURO_HEADER_OUTPUT: .build/header-rendering/current
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: ./scripts/run-hosted-native-proof.sh header
      - name: Checkout the flat released negative control
        if: always()
        uses: actions/checkout@v5
        with:
          ref: v0.9.95
          path: .ci/header-baseline
      - name: Render the same document in the released flat layout
        if: always()
        env:
          OURO_HEADER_RENDERING: '1'
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_HEADER_EXPECT_GLASS: '0'
          OURO_HEADER_REQUIRE_LIVE_PAINT: ${{ matrix.runner == 'macos-26-intel' && '1' || '0' }}
          OURO_HEADER_REQUIRE_FULLSCREEN: '0'
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: |
          cp Tests/OuroMDTests/NativeHeaderRenderingTests.swift .ci/header-baseline/Tests/OuroMDTests/
          export OURO_HEADER_OUTPUT="$PWD/.build/header-rendering/flat-v0.9.95"
          export OURO_PROOF_RUNNER="$PWD/scripts/run-hosted-native-proof.sh"
          cd .ci/header-baseline
          "$OURO_PROOF_RUNNER" header
      - name: Checkout the reflected-edge regression control
        if: always()
        uses: actions/checkout@v5
        with:
          ref: v0.9.104
          path: .ci/header-echo
      - name: Prove the old reflected header remains distinguishable from quiet chrome
        if: always()
        env:
          OURO_HEADER_RENDERING: '1'
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_HEADER_EXPECT_GLASS: '1'
          OURO_HEADER_EXPECT_ECHO: '1'
          OURO_HEADER_REQUIRE_LIVE_PAINT: ${{ matrix.runner == 'macos-26-intel' && '1' || '0' }}
          OURO_HEADER_REQUIRE_FULLSCREEN: '0'
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: |
          cp Tests/OuroMDTests/NativeHeaderRenderingTests.swift .ci/header-echo/Tests/OuroMDTests/
          export OURO_HEADER_OUTPUT="$PWD/.build/header-rendering/echo-v0.9.104"
          export OURO_PROOF_RUNNER="$PWD/scripts/run-hosted-native-proof.sh"
          cd .ci/header-echo
          "$OURO_PROOF_RUNNER" header
      - name: Restore owned preferences after interrupted native capture
        if: always()
        env:
          OURO_NATIVE_PREFERENCE_PROOF: '1'
        run: |
          OURO_HEADER_OUTPUT=.build/header-rendering/flat-v0.9.95 ./scripts/run-hosted-native-proof.sh header --restore
          OURO_HEADER_OUTPUT=.build/header-rendering/echo-v0.9.104 ./scripts/run-hosted-native-proof.sh header --restore
          OURO_HEADER_OUTPUT=.build/header-rendering/current ./scripts/run-hosted-native-proof.sh header --restore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-header-rendering-${{ matrix.runner }}
          path: .build/header-rendering
          if-no-files-found: error
