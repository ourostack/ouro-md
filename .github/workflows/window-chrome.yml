name: Window chrome

# Captures real moving editor content plus native chrome, with a released
# flat-layout negative control. Interactive tests run only on the hosted Mac.

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'make-app.sh'
      - 'Package.swift'
      - 'scripts/capture-window-chrome.sh'
      - 'scripts/lib/window-id.swift'
      - '.github/workflows/window-chrome.yml'
      - 'Tests/OuroMDTests/NativeHeaderRenderingTests.swift'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture window chrome
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (macOS 27 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          sw_vers
      - name: Render the live native header over moving document content
        env:
          OURO_HEADER_RENDERING: '1'
          OURO_HEADER_EXPECT_UNDERLAP: '1'
          OURO_HEADER_OUTPUT: .build/header-rendering/current
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: swift test --filter NativeHeaderRenderingTests
      - name: Checkout the flat released negative control
        uses: actions/checkout@v5
        with:
          ref: v0.9.95
          path: .ci/header-baseline
      - name: Render the same document in the released flat layout
        if: always()
        env:
          OURO_HEADER_RENDERING: '1'
          OURO_HEADER_EXPECT_UNDERLAP: '0'
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: |
          cp Tests/OuroMDTests/NativeHeaderRenderingTests.swift .ci/header-baseline/Tests/OuroMDTests/
          export OURO_HEADER_OUTPUT="$PWD/.build/header-rendering/flat-v0.9.95"
          cd .ci/header-baseline
          swift test --filter NativeHeaderRenderingTests
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-header-rendering
          path: .build/header-rendering
          if-no-files-found: error
