name: Window chrome

# Captures the packaged app's real window chrome on macOS 27 so system design
# changes (title bar, toolbar, sidebar, floating bars) can be reviewed from
# screenshots. Informational: it uploads images and does not gate merges.

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'make-app.sh'
      - 'Package.swift'
      - 'scripts/capture-window-chrome.sh'
      - 'scripts/lib/window-id.swift'
      - '.github/workflows/window-chrome.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture window chrome
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 27 (macOS 27 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          sw_vers
      - name: Build the app bundle
        env:
          OURO_MD_DISTRIBUTION_CHANNEL: local
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: ./make-app.sh
      - name: Capture window chrome
        run: ./scripts/capture-window-chrome.sh OuroMD.app .build/window-chrome
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: window-chrome
          path: .build/window-chrome
          if-no-files-found: warn
