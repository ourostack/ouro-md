name: Native site media and accessibility

on:
  pull_request:
    paths:
      - 'Tests/OuroMDTests/NativeSiteMediaCaptureTests.swift'
      - 'Tests/OuroMDTests/NativeAccessibilityPreferenceTests.swift'
      - 'Tests/Fixtures/**'
      - 'scripts/run-hosted-native-proof.sh'
      - '.github/workflows/site-media.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-site-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Public fixture native capture (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Toolchain and renderer provenance
        run: |
          sw_vers
          xcodebuild -version
          system_profiler SPDisplaysDataType
      - name: Require the final published native release and identical production source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$(./scripts/verify-release-version.sh --print)" != '0.9.99' ]]; then
            echo 'capture=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Publication capture skipped: this candidate is not the pinned published media release. Recapture after its release is verified.'
            exit 0
          fi
          test "$(./scripts/verify-release-version.sh --print)" = '0.9.99'
          test "$(gh api repos/ourostack/ouro-md/releases/tags/v0.9.99 --jq 'select(.draft == false).tag_name')" = 'v0.9.99'
          git diff --exit-code v0.9.99 HEAD -- Sources
          echo "OURO_SITE_MEDIA_RELEASE_COMMIT=$(git rev-parse 'v0.9.99^{commit}')" >> "$GITHUB_ENV"
          echo 'capture=true' >> "$GITHUB_OUTPUT"
      - name: Capture real public-document action frames
        if: steps.release.outputs.capture == 'true'
        env:
          OURO_SITE_MEDIA: '1'
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_SITE_MEDIA_OUTPUT: .build/site-media
          OURO_SITE_MEDIA_REQUIRE_BODY_PAINT: '1'
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: ./scripts/run-hosted-native-proof.sh media
      - name: Restore owned preferences after interrupted capture
        if: always() && steps.release.outputs.capture == 'true'
        env:
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_SITE_MEDIA_OUTPUT: .build/site-media
        run: ./scripts/run-hosted-native-proof.sh media --restore
      - uses: actions/upload-artifact@v6
        if: always() && steps.release.outputs.capture == 'true'
        with:
          name: public-document-native-${{ matrix.runner }}
          path: .build/site-media
          if-no-files-found: error

  accessibility:
    name: Native accessibility (${{ matrix.state }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - state: baseline
            motion: '0'
            transparency: '0'
          - state: reduce-motion
            motion: '1'
            transparency: '0'
          - state: reduce-transparency
            motion: '0'
            transparency: '1'
          - state: both
            motion: '1'
            transparency: '1'
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Dedicated hosted preference probe with exact key restoration
        env:
          OURO_ACCESSIBILITY_PROOF: '1'
          OURO_NATIVE_PREFERENCE_PROOF: '1'
          OURO_ACCESSIBILITY_STATE: ${{ matrix.state }}
          OURO_EXPECT_REDUCE_MOTION: ${{ matrix.motion }}
          OURO_EXPECT_REDUCE_TRANSPARENCY: ${{ matrix.transparency }}
          OURO_MD_TELEMETRY_DISABLED: '1'
        run: ./scripts/run-hosted-native-proof.sh accessibility
      - name: Restore owned preferences after interrupted accessibility test
        if: always()
        env:
          OURO_NATIVE_PREFERENCE_PROOF: '1'
        run: ./scripts/run-hosted-native-proof.sh accessibility --restore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: accessibility-${{ matrix.state }}
          path: .build/accessibility-proof
          if-no-files-found: error
