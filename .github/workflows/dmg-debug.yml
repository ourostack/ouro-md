name: dmg-debug
on:
  push:
    branches: [fix-dmg-detach]
jobs:
  debug:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Verify like Release
        env:
          GH_TOKEN: ${{ github.token }}
          OURO_MD_RENDERED_TEXT_AUDIT_ELSEWHERE: "1"
        run: |
          sha="$(git ls-remote https://github.com/${{ github.repository }} refs/tags/v0.9.142 | cut -f1)"
          ./scripts/release-policy.sh verify-published --version 0.9.142 --sha "$sha"
