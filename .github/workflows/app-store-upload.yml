name: App Store upload

# Builds the sandboxed Mac App Store package from main, signs it with the Mac App Distribution and
# Mac Installer Distribution identities, and validates it with App Store Connect. With upload=true it
# also uploads the build. It never submits for review: that happens in App Store Connect once the
# build is VALID.
#
# The run creates a temporary keychain, profile and API key file under RUNNER_TEMP and deletes the
# keychain at the end, pass or fail. No signing material is printed or kept in the artifacts.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the validated package to App Store Connect
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: app-store-upload
  cancel-in-progress: false

jobs:
  package:
    name: Package for the Mac App Store
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select Xcode 27.2 (macOS 27.2 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Checkout Apple distribution kit
        uses: actions/checkout@v5
        with:
          repository: ourostack/apple-distribution-kit
          path: .ci/apple-distribution-kit

      - name: Build Apple distribution kit
        working-directory: .ci/apple-distribution-kit
        run: |
          npm ci
          npm run build

      - name: Prepare App Store signing
        env:
          APP_P12_BASE64: ${{ secrets.MAC_APP_STORE_APP_CERTIFICATE_P12_BASE64 }}
          APP_P12_PASSWORD: ${{ secrets.MAC_APP_STORE_APP_CERTIFICATE_PASSWORD }}
          INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 }}
          INSTALLER_P12_PASSWORD: ${{ secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in APP_P12_BASE64 APP_P12_PASSWORD INSTALLER_P12_BASE64 INSTALLER_P12_PASSWORD PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing App Store signing secret(s): ${missing[*]}"
            exit 1
          fi

          dir="$RUNNER_TEMP/app-store-signing"
          mkdir -p "$dir/private_keys"
          chmod 700 "$dir"
          keychain="$dir/ouro-md-app-store.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          for kind in APP INSTALLER; do
            b64_var="${kind}_P12_BASE64"; pw_var="${kind}_P12_PASSWORD"
            p12="$dir/$kind.p12"
            printf '%s' "${!b64_var}" | base64 --decode > "$p12"
            chmod 600 "$p12"
            security import "$p12" -k "$keychain" -P "${!pw_var}" -f pkcs12 \
              -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security >/dev/null
            : > "$p12"
          done
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/[ "]*//g')

          app_identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(3rd Party Mac Developer Application: [^"]*\)".*/\1/p; s/.*"\(Apple Distribution: [^"]*\)".*/\1/p' | head -1)"
          installer_identity="$(security find-identity -v "$keychain" | sed -n 's/.*"\(3rd Party Mac Developer Installer: [^"]*\)".*/\1/p; s/.*"\(Mac Installer Distribution: [^"]*\)".*/\1/p' | head -1)"
          [[ -n "$app_identity" ]] || { echo "::error::The app certificate secret holds no Mac App Store signing identity"; exit 1; }
          [[ -n "$installer_identity" ]] || { echo "::error::The installer certificate secret holds no Mac installer identity"; exit 1; }

          profile="$dir/OuroMD-MacAppStore.provisionprofile"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$profile"
          key="$dir/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"

          {
            echo "APP_STORE_SIGNING_KEYCHAIN=$keychain"
            echo "OURO_APP_STORE_APP_IDENTITY=$app_identity"
            echo "OURO_APP_STORE_INSTALLER_IDENTITY=$installer_identity"
            echo "OURO_APP_STORE_PROVISIONING_PROFILE=$profile"
            echo "APP_STORE_CONNECT_API_KEY_ID=$ASC_KEY_ID"
            echo "APP_STORE_CONNECT_API_ISSUER_ID=$ASC_ISSUER_ID"
            echo "APP_STORE_CONNECT_API_KEY_PATH=$key"
            echo "API_PRIVATE_KEYS_DIR=$dir/private_keys"
          } >> "$GITHUB_ENV"
          echo "app identity: $app_identity"
          echo "installer identity: $installer_identity"

      - name: Readiness
        run: |
          ./scripts/package-app-store.sh --readiness --artifact dist/app-store/readiness.json
          python3 -I -c 'import json,sys; r=json.load(open(sys.argv[1])); b=r.get("blockers",[]); [print("blocker:",x["code"],"-",x["message"]) for x in b]; sys.exit(1 if b else 0)' dist/app-store/readiness.json

      - name: Package and validate
        if: ${{ !inputs.upload }}
        run: ./scripts/package-app-store.sh --validate

      - name: Package, validate and upload
        if: ${{ inputs.upload }}
        run: ./scripts/package-app-store.sh --upload

      - name: Record the package
        run: |
          set -euo pipefail
          pkg="$(ls dist/app-store/*.pkg)"
          {
            echo "### Mac App Store package"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' OuroMD.app/Contents/Info.plist) ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' OuroMD.app/Contents/Info.plist))"
            echo "- Package: \`$(basename "$pkg")\`, SHA-256 \`$(shasum -a 256 "$pkg" | cut -d' ' -f1)\`"
            echo "- Uploaded: ${{ inputs.upload }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v6
        with:
          name: ouro-md-app-store-${{ github.run_id }}
          path: |
            dist/app-store/*.pkg
            dist/app-store/readiness.json
          if-no-files-found: error

      - name: Delete signing keychain
        if: always()
        run: |
          if [[ -n "${APP_STORE_SIGNING_KEYCHAIN:-}" && -f "$APP_STORE_SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$APP_STORE_SIGNING_KEYCHAIN"
          fi
          if [[ -n "${APP_STORE_CONNECT_API_KEY_PATH:-}" && -f "$APP_STORE_CONNECT_API_KEY_PATH" ]]; then
            : > "$APP_STORE_CONNECT_API_KEY_PATH"
          fi
