name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older run, so stale runs stop holding the organization's few macOS runners.
# Pushes to main each keep their own group and are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift-test:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show the toolchain (the free image's default Xcode)
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify release version contract
        run: ./scripts/verify-release-version.sh
      - name: Verify release freshness policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/release-policy.sh freshness
      - name: Verify release policy PR base handling
        run: ./scripts/release-policy.sh selftest-pr-base
      - name: Verify release API fallback
        run: ./scripts/release-policy.sh selftest-release-api-fallback
      - name: Verify release package shell guard
        run: ./scripts/release-policy.sh selftest-package-guards
      - name: Verify shell dependency watch automation
        run: ./scripts/release-policy.sh selftest-shell-dependency-watch
      - name: Verify live update runner policy
        run: ./scripts/release-policy.sh selftest-live-update-runner
      - name: Verify App Store resubmission freshness exception
        run: ./scripts/release-policy.sh selftest-app-store-resubmission
      - name: Verify release policy path classification
        run: ./scripts/release-policy.sh selftest-paths
      - name: Verify no pull request job uses the billed xcode-27 runner
        run: |
          python3 -I scripts/check-ci-runners.py --selftest
          python3 -I scripts/check-ci-runners.py
      - name: Verify version bump guard
        run: ./scripts/bump-version.sh --selftest
      - name: Verify the per-test time budget and its stall retry
        run: ./scripts/swift-test-budget.sh --selftest
      - name: Scan source policy
        run: ./scripts/release-policy.sh scan .
      - name: Verify shared shell dependency freshness
        run: ./scripts/check-shell-dependency.sh
      - name: Checkout Apple distribution kit
        uses: actions/checkout@v5
        with:
          repository: ourostack/apple-distribution-kit
          path: .ci/apple-distribution-kit
      - name: Build Apple distribution kit
        working-directory: .ci/apple-distribution-kit
        run: |
          npm ci
          npm run build
      - name: Verify Apple distribution kit contract
        run: ./scripts/check-apple-distribution-kit.sh
      - name: Verify App Store packaging contract
        run: |
          plutil -lint config/app-store-entitlements.plist
          ./scripts/package-app-store.sh --help >/dev/null
          ./scripts/check-app-store-build.sh
      - name: Verify app control deck
        run: ./scripts/check-app-control-deck.py
      - name: Verify shared shell boundary selftest
        run: ./scripts/check-shell-boundary.sh --selftest
      - name: Verify shared shell boundary
        run: ./scripts/check-shell-boundary.sh
      - name: Check signing and notarization readiness
        run: |
          ./scripts/check-signing-readiness.sh
          ./scripts/check-signing-readiness.sh --selftest
          ./scripts/sign-notarize-app.sh --selftest
          ./scripts/prepare-ci-signing-assets.sh
      - name: Run tests
        run: ./scripts/swift-test-budget.sh
      - name: Test agent-change cue model
        run: node --test scripts/test-change-marks.cjs
      - name: Check file watcher concurrency
        run: swift test --sanitize=thread --filter FileWatcher
      - name: Upload Swift test timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-test-timings
          path: |
            .build/ouro-swift-test.log
            .build/ouro-test-timings.tsv
            .build/print-layout-test-artifacts/preview-state-screenshots-*/*.png

  app-bundle:
    name: App bundle
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show the toolchain (the free image's default Xcode)
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build the app bundle
        run: ./make-app.sh
      - name: Verify packaged app probes
        env:
          OURO_MD_ALLOW_UNCONFIGURED_TELEMETRY: "1"
          OURO_MD_RENDERED_TEXT_AUDIT_ELSEWHERE: "1"
        run: ./scripts/verify-packaged-app.sh OuroMD.app

  native-scenario-verifier:
    name: Native scenario verifier
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show the toolchain (the free image's default Xcode)
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build
        run: swift build
      - name: Run headless editor harnesses
        env:
          OURO_VISUAL_ARTIFACT_DIR: ${{ runner.temp }}/ouro-md-artifacts/visual-qa
          OURO_MD_RENDERED_TEXT_AUDIT_ELSEWHERE: "1"
        run: ./scripts/run-native-scenarios.sh
      - name: Package the harness binary for the rendered text audit
        run: |
          bin="$(swift build --show-bin-path)"
          tar -czf "$RUNNER_TEMP/ouro-md-harness.tgz" -C "$bin" ouro-md $(cd "$bin" && ls -d *.bundle)
      - uses: actions/upload-artifact@v6
        with:
          name: ouro-md-harness
          path: ${{ runner.temp }}/ouro-md-harness.tgz
          retention-days: 3

  rendered-text-audit:
    name: Rendered text audit
    # Vision text recognition failed on the Xcode 27 image, so the shell label
    # check runs the same binary on macos-15, where it works. (The verifier now
    # runs on macos-26; folding this back in is a later change.)
    needs: native-scenario-verifier
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: ouro-md-harness
          path: ${{ runner.temp }}
      - name: Run the rendered-text checks with text recognition
        run: |
          mkdir -p "$RUNNER_TEMP/harness"
          tar -xzf "$RUNNER_TEMP/ouro-md-harness.tgz" -C "$RUNNER_TEMP/harness"
          sw_vers
          "$RUNNER_TEMP/harness/ouro-md" --accessibilityaudit | tee "$RUNNER_TEMP/audit.log"
          grep -q "shell rendered accessibility labels: ✓" "$RUNNER_TEMP/audit.log"
          "$RUNNER_TEMP/harness/ouro-md" --uisurfacetest | tee "$RUNNER_TEMP/surface.log"
          grep -q "direct shell install suppressed; review prompt available: ✓$" "$RUNNER_TEMP/surface.log"
      - name: Upload visual QA artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: native-scenario-visual-artifacts
          path: ${{ runner.temp }}/ouro-md-artifacts

  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Show the toolchain (the free image's default Xcode)
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Enforce 100% line+region coverage on pure support targets
        run: ./scripts/check-coverage.sh
      - name: Upload coverage test timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-test-timings
          path: |
            .build/ouro-coverage-swift-test.log
            .build/ouro-coverage-test-timings.tsv
            .build/ouro-coverage.json

  ax-xray:
    name: AX X-ray
    # Ouro AX for Apple's X-ray reads the built app's App Intents metadata and lints its app skills. Xcode 26 on the
    # free image writes that metadata, so this runs on every pull request without the billed runner. The behaviour
    # stage (AppIntentsTesting) is a named skip: macOS refuses it for an ad-hoc-signed app (error 800), and CI holds
    # no Apple Development certificate. config/xray-expected.json lists what holds and why the rest is open.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Find the ouro-ui-apple release Ouro MD pins
        id: pin
        run: |
          python3 -I -c 'import json,sys; p = next(p for p in json.load(open(sys.argv[1]))["pins"] if p["identity"] == "ouro-ui-apple"); print("version=" + p["state"]["version"]); print("revision=" + p["state"]["revision"])' Package.resolved >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: ourostack/ouro-ui-apple
          ref: ${{ steps.pin.outputs.revision }}
          path: .ci/ouro-ui-apple
          persist-credentials: false
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Check the X-ray checker
        run: python3 -I scripts/check-xray.py --selftest
      - name: Build the X-ray
        working-directory: .ci/ouro-ui-apple
        run: swift build -c release --product ouro-ax-xray
      - name: Build the app
        run: OURO_MD_TELEMETRY_DISABLED=1 ./make-app.sh
      - name: X-ray the App Intents and app skills
        run: |
          .ci/ouro-ui-apple/.build/release/ouro-ax-xray --app OuroMD.app --commit "$(git rev-parse --short HEAD)" \
            --name "Ouro MD" --out .build/xray --format md >> "$GITHUB_STEP_SUMMARY"
      - name: Check what it proves
        run: python3 -I scripts/check-xray.py .build/xray/report.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ax-xray
          path: .build/xray

  xcode-27-sdk:
    name: Xcode 27 SDK
    # Runners: every check above runs on GitHub's free images. Only this job needs Xcode 27 (the macOS 27 SDK the app
    # ships with), and it runs on the billed xcode-27 runner only for pushes to main, never on pull requests. Ouro MD's
    # Actions budget caps the spend at $15 a month. When the free macOS image carries Xcode 27, follow README's
    # "CI runners" to drop this lane.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select Xcode 27.2 (macOS 27.2 SDK)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app/Contents/Developer
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Build the app bundle against the macOS 27 SDK
        run: OURO_MD_TELEMETRY_DISABLED=1 ./make-app.sh
      - name: Verify the bundle carries the macOS 27 SDK and its App Intents metadata
        env:
          OURO_MD_MIN_SDK_MAJOR: "27"
          OURO_MD_ALLOW_UNCONFIGURED_TELEMETRY: "1"
          OURO_MD_RENDERED_TEXT_AUDIT_ELSEWHERE: "1"
        run: ./scripts/verify-packaged-app.sh OuroMD.app
      - name: Run tests with Xcode 27
        run: ./scripts/swift-test-budget.sh
