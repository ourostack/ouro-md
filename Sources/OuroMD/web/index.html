<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="vditor/dist/index.css">
<style>
  /* Change highlight: pasted text and assistant changes glow
     briefly; bridge.js fades --ouro-flash from 1 to 0. Themes set
     --ouro-change-color to their accent; user themes get this default. */
  ::highlight(ouro-change){background-color:color-mix(in srgb,var(--ouro-change-color,#2f7de1) calc(var(--ouro-flash,0) * 30%),transparent);}
  .ouro-change-flash{background-color:color-mix(in srgb,var(--ouro-change-color,#2f7de1) calc(var(--ouro-flash,0) * 30%),transparent)!important;border-radius:3px;}
  #ouro-change-marks{position:fixed;inset:48px 0 32px;overflow:hidden;pointer-events:none;z-index:3;}
  .ouro-change-mark{position:absolute;width:2px;border-radius:2px;background:var(--ouro-change-color,#2f7de1);opacity:.55;pointer-events:none;}
  .ouro-change-deletion{width:7px;}
  #ouro-next-change{position:fixed;right:16px;bottom:12px;z-index:4;padding:5px 10px;border:1px solid color-mix(in srgb,var(--ouro-change-color,#2f7de1) 25%,transparent);border-radius:8px;background:Canvas;color:CanvasText;font:12px system-ui;cursor:pointer;}
  #ouro-next-change:focus-visible{outline:2px solid var(--ouro-change-color,#2f7de1);outline-offset:2px;}
  #ouro-next-change[hidden]{display:none;}
  @media print{#ouro-change-marks,#ouro-next-change{display:none!important;}}
  /* Open Sans — bundled under Apache-2.0 so the
     reading surface matches regardless of installed system fonts. */
  @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/open-sans-400.woff2") format("woff2"); }
  @font-face { font-family: "Open Sans"; font-style: italic; font-weight: 400; font-display: swap; src: url("fonts/open-sans-400i.woff2") format("woff2"); }
  @font-face { font-family: "Open Sans"; font-style: normal; font-weight: 700; font-display: swap; src: url("fonts/open-sans-700.woff2") format("woff2"); }
  @font-face { font-family: "Open Sans"; font-style: italic; font-weight: 700; font-display: swap; src: url("fonts/open-sans-700i.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: transparent; }
  body { min-height: 100vh; }
  body.ouro-source-mode {
    height: 100vh;
    overflow: hidden;
  }
  body.ouro-source-mode #editor,
  body.ouro-source-mode #editor > .vditor {
    height: 100% !important;
  }
  /* The native window owns the chrome; keep the editor toolbar hidden for a
     distraction-free, content-first surface. */
  .vditor-toolbar { display: none !important; }
  /* GitHub-style alert callouts (> [!NOTE] ...). */
  .vditor-reset blockquote.ouro-alert {
    --ouro-alert-color: #59636e;
    border-left-width: 4px !important;
  }
  .vditor-reset blockquote.ouro-alert::before {
    color: var(--ouro-alert-color);
    content: attr(data-ouro-alert-label);
    display: block;
    font-weight: 700;
    margin-bottom: 0.35em;
  }
  .vditor-reset blockquote.ouro-alert .ouro-alert-marker {
    font-size: 0 !important;
    line-height: 0 !important;
    opacity: 0;
    user-select: text;
  }
  .vditor-reset blockquote.ouro-alert.ouro-callout-editing::before { display: none; }
  .vditor-reset blockquote.ouro-alert.ouro-callout-editing .ouro-alert-marker {
    font-size: inherit !important;
    line-height: inherit !important;
    opacity: 0.6;
    user-select: text;
  }
  .vditor-reset blockquote.ouro-alert-note {
    --ouro-alert-color: #0969da;
    border-left-color: #0969da !important;
  }
  .vditor-reset blockquote.ouro-alert-tip {
    --ouro-alert-color: #1a7f37;
    border-left-color: #1a7f37 !important;
  }
  .vditor-reset blockquote.ouro-alert-important {
    --ouro-alert-color: #8250df;
    border-left-color: #8250df !important;
  }
  .vditor-reset blockquote.ouro-alert-warning {
    --ouro-alert-color: #9a6700;
    border-left-color: #9a6700 !important;
  }
  .vditor-reset blockquote.ouro-alert-caution {
    --ouro-alert-color: #cf222e;
    border-left-color: #cf222e !important;
  }
  .vditor-ir .vditor-ir__node[data-type="link-ref"] {
    color: var(--ir-bracket-color);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 0.12em;
  }
  .vditor-ir .vditor-ir__node--expand[data-type="link-ref"] .vditor-ir__marker {
    display: none !important;
    height: 0 !important;
    overflow: hidden !important;
    padding: 0 !important;
    width: 0 !important;
  }
  .vditor-preview__action {
    position: sticky;
    top: 0;
    z-index: 2;
  }
  .vditor-preview .vditor-reset h1,
  .vditor-preview .vditor-reset h2,
  .vditor-preview .vditor-reset h3,
  .vditor-preview .vditor-reset h4,
  .vditor-preview .vditor-reset h5,
  .vditor-preview .vditor-reset h6 {
    scroll-margin-top: 44px;
  }
  /* The [!WARNING] marker sits on its own source line; in the reading view
     collapse that newline so the label sits directly above the body instead of
     leaving an empty line. Editing state keeps pre-wrap for source fidelity. */
  .vditor-reset blockquote.ouro-alert:not(.ouro-callout-editing) > p { white-space: normal; }
</style>
<!-- Swapped at runtime by the native app to apply the active theme. -->
<style id="ouro-theme"></style>
</head>
<body>
  <div id="editor"></div>
  <div id="ouro-change-marks" aria-hidden="true"></div>
  <button id="ouro-next-change" type="button" hidden>Next change</button>
  <script src="vditor/dist/index.min.js"></script>
  <script src="unicode-case-fold.js"></script>
  <script src="change-marks.js"></script>
  <script src="bridge.js"></script>
</body>
</html>
