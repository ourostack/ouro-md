<svg xmlns="http://www.w3.org/2000/svg" width="800" height="280" viewBox="0 0 800 280" role="img" aria-labelledby="title desc">
  <title id="title">Periscope optics</title>
  <desc id="desc">An original cross-section of a fictional submarine periscope. Light from the surface enters the head prism, travels down the mast tube and leaves the eyepiece prism inside the salon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e7c8"/>
      <stop offset="1" stop-color="#e9d3a6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9bb0"/>
      <stop offset="1" stop-color="#173f57"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d7c86"/>
      <stop offset="0.5" stop-color="#b8c3c9"/>
      <stop offset="1" stop-color="#6d7c86"/>
    </linearGradient>
    <clipPath id="card"><rect width="800" height="280" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="800" height="280" fill="url(#sea)"/>
    <rect width="800" height="78" fill="url(#sky)"/>
    <circle cx="690" cy="34" r="16" fill="#f2b84b"/>
    <path d="M0 78 C40 70 80 86 120 78 S200 70 240 78 S320 86 360 78 S440 70 480 78 S560 86 600 78 S680 70 720 78 S780 84 800 78 V96 H0 Z" fill="#7fc0cf" opacity="0.65"/>
    <path d="M0 160 C120 150 240 172 400 162 S640 150 800 164" fill="none" stroke="#9fd3de" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M150 238 C220 214 580 214 650 238 L650 280 L150 280 Z" fill="#0d2737"/>
    <path d="M170 236 C240 218 560 218 630 236" fill="none" stroke="#2b5d78" stroke-width="2"/>
    <circle cx="220" cy="256" r="7" fill="#f2b84b" opacity="0.85"/>
    <circle cx="262" cy="256" r="7" fill="#f2b84b" opacity="0.85"/>
    <circle cx="580" cy="256" r="7" fill="#f2b84b" opacity="0.85"/>
    <circle cx="538" cy="256" r="7" fill="#f2b84b" opacity="0.85"/>
    <path d="M346 236 C346 206 360 196 380 196 H452 C470 196 478 210 480 236 Z" fill="#163a50" stroke="#2b5d78" stroke-width="2"/>
    <rect x="388" y="44" width="24" height="210" rx="4" fill="url(#tube)"/>
    <path d="M384 40 H420 V68 H384 Z" fill="#53636d"/>
    <path d="M388 44 L412 44 L412 68 Z" fill="#cfeef6" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M388 230 L388 254 L412 254 Z" fill="#cfeef6" stroke="#ffffff" stroke-width="1.5"/>
    <path d="M300 52 H399 V243 H460" fill="none" stroke="#f2b84b" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>
    <path d="M452 237 L464 243 L452 249" fill="none" stroke="#f2b84b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="472" cy="243" r="6" fill="#f6e7c8"/>
    <g font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#f4f7f8">
      <text x="430" y="58" fill="#3b3226">Head prism</text>
      <text x="196" y="57" fill="#3b3226">Light from the surface</text>
      <text x="430" y="150">Mast tube · 9 m</text>
      <text x="214" y="190">Eyepiece prism</text>
      <text x="486" y="230">Salon</text>
      <text x="24" y="120" font-size="13" fill="#cfe7ee">Periscope depth · 14 m</text>
    </g>
    <path d="M326 194 L384 236" stroke="#f4f7f8" stroke-width="1.2" stroke-opacity="0.7"/>
  </g>
</svg>
