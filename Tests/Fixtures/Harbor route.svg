    <linearGradient id="water" x2="1" y2="1">
      <stop stop-color="#b9dee7"/>
      <stop offset="1" stop-color="#6aaaba"/>
    </linearGradient>
  </defs>
  <rect width="800" height="200" rx="12" fill="url(#water)"/>
  <path d="M0 106 C90 71 158 144 258 114 S398 74 484 105 S650 139 800 82 L800 200 H0Z" fill="#f0e8d7"/>
  <path d="M90 140 C172 157 201 144 280 135 S414 113 490 142 S594 160 700 122" fill="none" stroke="#bc7950" stroke-width="3" stroke-dasharray="7 6"/>
